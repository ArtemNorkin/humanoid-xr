<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a1120"><title>3D-модель робота — курсовой проект</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">H<span>X</span></span><div><b>HUMANOID XR</b></div></div><div class="tag">КУРСОВОЙ ПРОЕКТ · ВАРИАНТ А</div><h1>3D-модель<br><em>робота</em></h1><p class="lead">Просмотр трёхмерной модели робота. Можно изменять ракурс, масштаб и освещение.</p><div class="panel"><h2>РАКУРСЫ</h2><div class="viewgrid"><button data-view="front">Спереди</button><button data-view="side">Сбоку</button><button data-view="back">Сзади</button><button data-view="top">Сверху</button><button data-view="detail">Детали</button><button data-view="default" class="active">Общий вид</button></div></div><div class="panel"><h2>УПРАВЛЕНИЕ</h2><div class="actions"><button id="rotate">⏸ Автовращение</button><button id="reset">↺ Сброс</button><button id="fullscreen">⛶ На весь экран</button></div><label for="light">Освещение <output id="lightVal">100%</output></label><input id="light" type="range" min="30" max="180" value="100"></div><div class="panel"><h2>О МОДЕЛИ</h2><p id="info">Человекоподобная конструкция с головой, корпусом, руками и ногами. Выберите узел ниже для справки.</p><div class="chips"><button data-info="head">Голова</button><button data-info="body">Корпус</button><button data-info="arms">Руки</button><button data-info="legs">Ноги</button></div></div></aside><main class="stage"><model-viewer id="robot" src="models/robot.glb?v=3" alt="Трёхмерная модель человекоподобного робота" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1" exposure="1" environment-image="neutral" camera-orbit="25deg 80deg 6m" min-camera-orbit="auto auto 1.8m" max-camera-orbit="auto auto 12m" interaction-prompt="auto" touch-action="pan-y"><button class="ar" slot="ar-button">◈ Смотреть в AR</button><div class="loading" slot="poster">Загрузка модели робота…</div></model-viewer></main></div><script src="app.js"></script></body></html>
